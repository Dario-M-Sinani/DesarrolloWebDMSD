<h1>Registrar Nuevo Libro</h1>

<form action="javascript:crearPersona()" method="post" id="datoslibro" enctype="multipart/form-data">
    <label for="imagen">Portada:</label>
    <input type="file" name="imagen" id="imagen"><br>

    <label for="titulo">Título:</label>
    <input type="text" name="titulo" id="titulo"><br>

    <label for="autor">Autor:</label>
    <input type="text" name="autor" id="autor"><br>

    <label for="ideditorial">Editorial (ID):</label>
    <input type="number" name="ideditorial" id="ideditorial"><br>

    <label for="anio">Año:</label>
    <input type="date" name="anio" id="anio"><br>

    <label for="idusuario">Usuario (ID):</label>
    <input type="number" name="idusuario" id="idusuario"><br>

    <label for="idcarrera">Carrera (ID):</label>
    <input type="number" name="idcarrera" id="idcarrera"><br>

    <input type="submit" value="Registrar">
</form>

<div id="respuesta"></div>

<script src="script.js"></script>
