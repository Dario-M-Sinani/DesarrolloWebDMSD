<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM</title>
    <style>
        .cont{
            margin: auto;
            width: 400px;
        }
      .resultado {
        width: 100px;
        border: 2px solid yellow;
        background-color: yellow;
        text-align: center;
        display: none;
      }
      input {
        border: 2px solid yellow;
      }
      button{
        background-color: yellow;
        
      }
    </style>
  </head>
  <body>
    <div class="cont">
    <label for="opes">operaciones</label>
    <select
      name="opes"
      id="opes"
      onchange="operaciones()"
      style="border: 1px solid yellow"
    >
      <option value="suma">Suma</option>
      <option value="resta">Resta</option>
      <option value="multiplicacion">Multiplicacion</option>
      <option value="division">Division</option></select
    ><br /><br />
    <label for="a">A</label>
    <input type="number" name="a" id="a" /><br /><br />
    <label for="b">B</label>
    <input type="number" name="b" id="b" /><br /><br />
    <button onclick="operaciones()">Calcular</button><br /><br />
    <div class="resultado" id="resultado"></div>
</div>
    <script>
      var result = 0;
      function operaciones() {
        var pr = document.getElementById("opes").value;
        const a = parseFloat(document.getElementById("a").value);
        const b = parseFloat(document.getElementById("b").value);

        switch (pr) {
          case "suma":
            result = a + b;
            break;
          case "resta":
            result = a - b;
            break;
          case "multiplicacion":
            result = a * b;
            break;
          case "division":
          result = a/b;
            break;
          default:
            result = "Operación no válida";
        }
        document.getElementById("resultado").innerHTML = result;
        document.getElementById("resultado").style.display = "block";
      }
    </script>
  </body>
</html>
